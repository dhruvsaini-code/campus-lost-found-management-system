<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Lost & Found</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f4f6;
            color: #1f2937;
        }

        nav {
            background: #172554;
            color: white;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 18px;
        }

        .container {
            max-width: 450px;
            margin: 65px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-bottom: 22px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 17px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .message {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            background: #e0f2fe;
        }

        .success {
            background: #dcfce7;
        }

        .error {
            background: #fee2e2;
        }

        .link {
            text-align: center;
            margin-top: 18px;
        }

        .link a {
            color: #2563eb;
            text-decoration: none;
        }

        .welcome {
            text-align: center;
            padding: 30px 10px;
        }
    </style>
</head>

<body>

    <nav>
        <strong>Campus Lost & Found</strong>

        <div>
            {% if session.get('student_id') %}
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('logout') }}">Logout</a>
            {% else %}
            <a href="{{ url_for('login') }}">Login</a>
            <a href="{{ url_for('register') }}">Register</a>
            {% endif %}
        </div>
    </nav>

    <div class="container">

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="message {{ category }}">
            {{ message }}
        </div>
        {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}

    </div>

</body>

</html>
