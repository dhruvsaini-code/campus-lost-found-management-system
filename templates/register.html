{% extends "base.html" %}

{% block title %}Student Registration &bull; Campus Lost &amp; Found{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 40px auto;">
    <div class="card" style="padding: 32px;">
        <div style="text-align: center; margin-bottom: 24px;">
            <div style="font-size: 36px; margin-bottom: 8px;">🎓</div>
            <h2 style="font-size: 22px; font-weight: 700;">Student Registration</h2>
            <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Create your account for campus lost &amp; found</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}">
            <div style="margin-bottom: 16px;">
                <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px;">Full Name</label>
                <input type="text" name="name" placeholder="e.g. Dhruv Saini" required style="width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px;">
            </div>

            <div style="margin-bottom: 16px;">
                <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px;">College Email</label>
                <input type="email" name="email" placeholder="e.g. s24cseu0818@bennett.edu.in" required style="width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px;">
            </div>

            <div style="margin-bottom: 22px;">
                <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px;">Password (min 8 characters)</label>
                <input type="password" name="password" placeholder="Create a strong password" required minlength="8" style="width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px;">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 15px;">Create Account &rarr;</button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted);">
            Already have an account? <a href="{{ url_for('login') }}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign in here</a>
        </div>
    </div>
</div>
{% endblock %}
