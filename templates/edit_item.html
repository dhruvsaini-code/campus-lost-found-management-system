{% extends "base.html" %}

{% block title %}Edit Item Report &bull; Campus Lost &amp; Found{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 24px auto;">
    <div class="card">
        <h2 style="font-size: 20px; margin-bottom: 6px;">Edit Item Report #{{ item.id }}</h2>
        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">
            Update information for this {{ item.type }} item listing.
        </p>

        <form method="POST" action="{{ url_for('edit_item', item_id=item.id) }}">
            <div style="margin-bottom: 16px;">
                <label style="display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px;">Title</label>
                <input type="text" name="title" value="{{ item.title }}" required style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px;">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px;">
                <div>
                    <label style="display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px;">Category</label>
                    <input type="text" name="category" value="{{ item.category }}" required style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px;">
                </div>
                <div>
                    <label style="display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px;">Date</label>
                    <input type="date" name="item_date" value="{{ item.item_date }}" required style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px;">
                </div>
            </div>

            <div style="margin-bottom: 16px;">
                <label style="display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px;">Location</label>
                <input type="text" name="location" value="{{ item.location }}" required style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px;">
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px;">Description</label>
                <textarea name="description" rows="4" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px;">{{ item.description }}</textarea>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <a href="{{ url_for('dashboard') }}" class="btn btn-outline">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
