{% extends "base.html" %}

{% block title %}Student Login &bull; Campus Lost &amp; Found{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 40px auto;">
    <div class="card" style="padding: 32px;">
        <div style="text-align: center; margin-bottom: 24px;">
            <div style="font-size: 36px; margin-bottom: 8px;">🎒</div>
            <h2 style="font-size: 22px; font-weight: 700;">Student Portal Login</h2>
            <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Sign in to report or claim campus items</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <div style="margin-bottom: 16px;">
                <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px;">College Email</label>
                <input type="email" name="email" placeholder="e.g. dhruv@bennett.edu.in" required style="width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px;">
            </div>

            <div style="margin-bottom: 22px;">
                <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px;">Password</label>
                <input type="password" name="password" placeholder="Enter your password" required style="width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px;">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 15px;">Sign In &rarr;</button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted);">
            Don't have an account? <a href="{{ url_for('register') }}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Register here</a>
        </div>
    </div>
</div>
{% endblock %}
